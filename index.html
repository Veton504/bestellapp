<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="images/logo.jpg" />
    <title>Bestell App</title>
  </head>
  <body>
    <header>
      <span class="logo">Bestell App</span>
    </header>

    <div class="content">
      <div class="hero">
        <img class="hero-image" src="images/banner.jpg" alt="Nudelgericht" />
        <img
          class="hero-logo"
          src="images/logo.jpg"
          alt="Logo Paradise Noodles"
        />
      </div>

      <section>
        <h1>Paradise Noodles</h1>
        <p>★★★★☆ 4,2 von 5 Sternen</p>
        <p>Asiatische Nudelgerichte, frisch zubereitet.</p>
        <p>Lieferkosten 5,00 € | Mindestbestellwert 10,00 €</p>
      </section>

      <h2>Hauptgerichte</h2>

      <div class="layout">
        <main id="menu"></main>

        <aside>
          <h2>Warenkorb</h2>
          <div id="basketItems"></div>
        </aside>
      </div>
    </div>

    <footer>© 2026 Paradise Noodles</footer>
    <button class="basket-button" id="basket-button">Warenkorb</button>
    <dialog id="basket-dialog">
      <h2>Warenkorb</h2>
      <div id="dialogItems"></div>
      <button class="close-button" id="close-dialog">Schließen</button>
    </dialog>

    <script src="dishes.js"></script>
    <script src="script.js"></script>
  </body>
</html>
